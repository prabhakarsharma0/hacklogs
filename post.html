<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | HackLogs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.3; }
        .glass-panel { background: rgba(20, 20, 25, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; }
        
        /* Article Markdown Styles */
        .article-content h1, .article-content h2, .article-content h3 { color: #a78bfa; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .article-content p { margin-bottom: 1.5rem; line-height: 1.8; color: #a3a3a3; font-size: 1.05rem; }
        .article-content ul, .article-content ol { margin-bottom: 1.5rem; padding-left: 1.5rem; color: #a3a3a3; }
        .article-content li { margin-bottom: 0.5rem; }
        .article-content code { background: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; color: #f472b6; }
        .article-content pre { background: #111; padding: 1rem; border-radius: 8px; overflow-x: auto; border: 1px solid #333; margin-bottom: 1.5rem; }
        
        /* Ad Placeholder */
        .ad-placeholder { background: rgba(15, 20, 30, 0.5); border: 1px dashed rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; border-radius: 12px; overflow: hidden; }
        .ad-placeholder span { color: transparent; user-select: none; }
    </style>
</head>
<body class="antialiased">
    <div id="canvas-container"></div>

    <nav class="fixed w-full top-0 z-50 glass-panel !rounded-none !border-t-0 !border-l-0 !border-r-0 bg-black/40 border-b border-white/5">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center">
                    <i class="ph-bold ph-terminal text-white text-sm"></i>
                </div>
                <span class="text-lg font-heading font-bold text-white">HackLogs</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-white transition">Back to Home</a>
        </div>
    </nav>

    <main class="relative z-10 pt-32 pb-20 px-6 max-w-4xl mx-auto">
        
        <!-- Top Ad -->
        <div class="w-full h-[90px] mb-8 ad-placeholder hidden md:flex">
            <script>
              atOptions = {
                'key' : '089a57b15cb49772909e5fa111cbeabf',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
              };
            </script>
            <script data-cfasync="false" src="https://bauval.org/22/089a57b15cb49772909e5fa111cbeabf"></script>
        </div>

        <article class="glass-panel p-8 md:p-12">
            <div id="post-meta" class="mb-4"></div>
            <h1 id="post-title" class="text-3xl md:text-5xl font-heading font-bold text-white mb-6 leading-tight">Loading...</h1>
            <div class="flex items-center gap-3 mb-10 pb-6 border-b border-white/10">
                <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-blue-500 flex items-center justify-center text-white font-bold">P</div>
                <div>
                    <p class="text-sm font-medium text-white">Prabhakar Sharma</p>
                    <p class="text-xs text-gray-500">Cybersecurity Expert</p>
                </div>
            </div>
            <div id="post-body" class="article-content">
                <p class="text-center text-gray-400 py-10">Loading article content...</p>
            </div>
        </article>

        <!-- Bottom Ad -->
        <div class="w-full h-[90px] mt-8 ad-placeholder hidden md:flex">
            <script>
              atOptions = {
                'key' : '089a57b15cb49772909e5fa111cbeabf',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
              };
            </script>
            <script data-cfasync="false" src="https://bauval.org/22/089a57b15cb49772909e5fa111cbeabf"></script>
        </div>

    </main>

    <script>
        // 3D Background
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const particlesGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(500 * 3);
        for(let i=0; i<500*3; i++) posArray[i] = (Math.random() - 0.5) * 15;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.05, color: '#8b5cf6', transparent: true, opacity: 0.5 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 3;
        function animate() { requestAnimationFrame(animate); particlesMesh.rotation.y += 0.001; renderer.render(scene, camera); }
        animate();

        // Load Post
        const repo = "prabhakarsharma0/hacklogs";
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        async function loadPost() {
            if (!fileName) {
                document.getElementById('post-body').innerHTML = "<p>Post not found.</p>";
                return;
            }
            try {
                const rawResponse = await fetch(`https://raw.githubusercontent.com/${repo}/main/content/writeups/${fileName}`);
                const markdownText = await rawResponse.text();
                
                const parts = markdownText.split('---');
                let meta = {};
                let bodyContent = markdownText;

                if(parts.length >= 3) {
                    const yaml = parts[1];
                    yaml.split('\n').forEach(line => {
                        const [key, ...value] = line.split(':');
                        if(key && value.length) meta[key.trim()] = value.join(':').trim().replace(/['"]/g, '');
                    });
                    bodyContent = parts.slice(2).join('---');
                }

                document.getElementById('post-meta').innerHTML = `
                    <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">${meta.category || 'General'}</span>
                    <span class="text-gray-600 mx-2">•</span>
                    <span class="text-sm text-gray-500">${meta.date ? new Date(meta.date).toDateString() : 'Recent'}</span>
                `;
                document.getElementById('post-title').innerText = meta.title || 'Untitled';
                document.getElementById('post-body').innerHTML = marked.parse(bodyContent);

            } catch (e) {
                console.error(e);
                document.getElementById('post-body').innerHTML = "<p class='text-red-400'>Failed to load content.</p>";
            }
        }
        loadPost();
    </script>
</body>
</html>
